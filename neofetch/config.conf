# omarchy-dotfiles neofetch config.
#
# Installed to ~/.config/neofetch/config.conf, which is the path plain
# `neofetch` reads, so typing neofetch gets this without any flag.
#
# neofetch always puts the logo to the LEFT of the info column; unlike fastfetch
# there is no top position. The Omarchy wordmark is a wide horizontal mark, so
# the art here is a narrowed rendition sized to sit beside the info rather than
# the full 81-column one used on the login banner.
#
# This file is sourced as bash by neofetch, so the width switch below is a
# normal shell conditional, not a neofetch feature.

print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory

    prin
    # Omarchy's own facts, guarded: this same config runs on Arch boxes that are
    # not Omarchy and on macOS, where an unguarded call prints an error row.
    if command -v omarchy-version >/dev/null 2>&1; then
        prin "Omarchy" "$(omarchy-version 2>/dev/null)"
    elif [ -d "$HOME/.local/share/omarchy" ]; then
        prin "Omarchy" "installed"
    fi

    _loc=$(cat /etc/omarchy-location 2>/dev/null || cat "$HOME/.config/omarchy-dotfiles/location" 2>/dev/null)
    [ -n "$_loc" ] && prin "Location" "$_loc"

    if command -v tailscale >/dev/null 2>&1; then
        _ts=$(tailscale ip -4 2>/dev/null | head -1)
        [ -n "$_ts" ] && prin "Tailscale" "$_ts"
    fi

    info cols
}

# ---- wordmark ---------------------------------------------------------------
image_backend="ascii"
ascii_bold="on"

# Pick art that leaves room for the info column. The info block runs about 46
# columns, so the 64-wide wordmark needs a terminal of roughly 118 to avoid
# wrapping; below that use the 52-wide one.
_nf_dir="${XDG_CONFIG_HOME:-$HOME/.config}/neofetch"
_nf_cols=${COLUMNS:-0}
case "$_nf_cols" in ''|*[!0-9]*) _nf_cols=0 ;; esac
[ "$_nf_cols" -lt 1 ] && _nf_cols=$(tput cols 2>/dev/null || echo 80)

if [ "$_nf_cols" -ge 118 ] && [ -f "$_nf_dir/omarchy.ascii" ]; then
    image_source="$_nf_dir/omarchy.ascii"
elif [ -f "$_nf_dir/omarchy-small.ascii" ]; then
    image_source="$_nf_dir/omarchy-small.ascii"
else
    image_source="ascii"
fi

# The gradient, six bands wide. neofetch substitutes ${c1}..${c6} in the art and
# maps them to these colour numbers. It cannot do per-column truecolor the way
# the login banner does, so this is the same pink to blue sweep quantised to the
# six colours neofetch gives us.
ascii_colors=(205 176 141 147 111 117)

# ---- info style -------------------------------------------------------------
colors=(205 7 141 111 7 7)      # title, @, underline, subtitle, colon, info
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"

title_fqdn="off"
os_arch="on"
uptime_shorthand="on"
memory_percent="on"
memory_unit="mib"
package_managers="on"
shell_path="off"
shell_version="on"
speed_shorthand="on"
cpu_brand="on"
cpu_cores="logical"
cpu_speed="on"
cpu_temp="off"
gpu_brand="on"
refresh_rate="off"

# colour blocks along the bottom, as neofetch normally shows them
block_range=(0 15)
color_blocks="on"
block_width=3
block_height=1
col_offset="auto"

gap=3
stdout="off"
