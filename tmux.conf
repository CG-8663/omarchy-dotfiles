# Chronara shared tmux config (cross-platform)

# Enable mouse for scroll, select, resize
set -g mouse on

# Vi keybindings for copy mode
setw -g mode-keys vi

# Increase scrollback
set -g history-limit 50000

# Clipboard: pbcopy on macOS, xclip/wl-copy on Linux (whichever exists)
if-shell 'uname | grep -q Darwin' \
  "bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy' ; \
   bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "if-shell 'command -v wl-copy' \
     \"bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'\" \
     \"bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'\""

# Status bar with session info
set -g status-style 'bg=colour235 fg=colour136'
set -g status-left '#[fg=cyan]#S '
set -g status-right '#[fg=white]%H:%M'
